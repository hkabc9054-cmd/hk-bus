<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<title>巴士到站</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#73AE52">
<meta name="description" content="香港巴士實時到站（九巴／城巴／新巴）">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="巴士到站">
<style>
:root{
  --main:#73AE52; --main-dark:#2c541e; --main-soft:#5f9441;
  --cream:#FBF1D7; --cream-2:#f3e6c2; --ink:#24351b; --muted:#6c7a5c;
  --kmb:#d2001f; --ctb:#0e7c86;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans HK","Microsoft JhengHei",sans-serif;
  -webkit-text-size-adjust:100%}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--main);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
  position:sticky;top:0;z-index:5;box-shadow:0 2px 0 var(--main-dark)}
.hrow{display:flex;align-items:center;gap:10px}
h1{font-size:20px;margin:0;flex:1;letter-spacing:.04em}
.btn{border:2px solid var(--main-dark);background:var(--cream);color:var(--main-dark);font-weight:700;
  border-radius:12px;padding:7px 12px;font-size:14px;font-family:inherit}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--main-dark);color:var(--cream)}
.status{font-size:12px;margin-top:6px;opacity:.95;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--cream)}
.dot.live{animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
main{padding:14px 14px 40px;max-width:640px;margin:0 auto}
.card{background:#fff;border:2px solid var(--main);border-radius:18px;margin-bottom:14px;overflow:hidden;
  box-shadow:0 3px 0 var(--main)}
.chead{background:var(--main);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
.chead .no{background:var(--cream);color:var(--main-dark);font-weight:800;border-radius:8px;
  min-width:26px;height:26px;display:grid;place-items:center;font-size:14px}
.chead .nm{flex:1;min-width:0}
.chead .nm b{display:block;font-size:17px}
.chead .nm small{opacity:.9;font-size:11px}
.x{background:transparent;border:0;color:#fff;font-size:20px;padding:4px 8px}
.row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--cream-2)}
.row:first-of-type{border-top:0}
.badge{min-width:54px;text-align:center;color:#fff;font-weight:800;font-size:17px;border-radius:9px;padding:4px 6px;background:var(--kmb)}
.badge.ctb{background:var(--ctb)}
.dest{flex:1;min-width:0;font-size:15px}
.dest small{display:block;color:var(--muted);font-size:11px}
.eta{text-align:right;font-variant-numeric:tabular-nums}
.eta b{font-size:20px;color:var(--main-dark)}
.eta b.soon{color:var(--kmb)}
.eta small{display:block;color:var(--muted);font-size:11px}
.empty,.err{padding:14px;color:var(--muted);font-size:14px}
.err{color:#a4311d}
.add{width:100%;padding:16px;font-size:16px;border:2px dashed var(--main);border-radius:18px;background:transparent;
  color:var(--main-dark);font-weight:700;font-family:inherit}
dialog{border:0;border-radius:20px;padding:0;width:min(92vw,520px);background:var(--cream);color:var(--ink);
  max-height:86vh;overflow:hidden}
dialog::backdrop{background:rgba(36,53,27,.5)}
.dhead{background:var(--main);color:#fff;padding:12px 16px;display:flex;align-items:center}
.dhead b{flex:1;font-size:17px}
.dbody{padding:14px;overflow:auto;max-height:calc(86vh - 56px)}
input[type=search],input[type=text]{width:100%;font-size:16px;padding:11px 12px;border:2px solid var(--main);
  border-radius:12px;background:#fff;color:var(--ink);font-family:inherit}
.res{list-style:none;margin:10px 0 0;padding:0}
.res li{padding:11px 12px;border:1px solid var(--cream-2);background:#fff;border-radius:12px;margin-bottom:8px;
  display:flex;gap:8px;align-items:center}
.res li span{flex:1}
.res li small{display:block;color:var(--muted);font-size:11px}
.hint{font-size:12px;color:var(--muted);margin:8px 0}
label{font-size:13px;font-weight:700;display:block;margin:12px 0 4px}
.install{display:none;background:var(--cream-2);border:2px solid var(--main);border-radius:14px;padding:10px 12px;
  margin-bottom:14px;font-size:14px}

.tools{display:flex;gap:8px;margin-bottom:12px}
.tools .btn{flex:1;padding:10px}
.cobadge{background:rgba(255,255,255,.28);padding:1px 7px;border-radius:6px;font-size:11px;margin-left:6px}
.stopedit{background:#fff;border:1px solid var(--cream-2);border-radius:12px;padding:12px;margin-bottom:10px}
.stopedit label{margin:8px 0 3px;font-size:12px;color:var(--muted)}
.stopedit select{width:100%;font-size:16px;padding:10px;border:2px solid var(--main);border-radius:12px;background:#fff;color:var(--ink);font-family:inherit}
.rowx{display:flex;gap:8px}
.del{background:#fdecea;color:#a4311d;border:1px solid #f5c6cb;border-radius:10px;padding:0 12px;font-family:inherit}
.sitem{padding:10px 12px;background:#fff;border:1px solid var(--cream-2);border-radius:12px;margin-bottom:8px}
.sitem:active{background:var(--cream-2)}
.sitem small{display:block;color:var(--muted);font-size:11px}
.actions{display:flex;gap:8px;margin-top:12px}
.actions .btn{flex:1;padding:11px}
.sbox{display:flex;gap:8px}
.sbox input{flex:1}
</style>
</head>
<body>
<header>
  <div class="hrow"><h1>🚌 巴士到站</h1></div>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">載入中…</span></div>
</header>
<main>
  <div class="tools">
    <button class="btn" id="settingsBtn" type="button">⚙️ 設定／搜尋站</button>
    <button class="btn" id="refreshBtn" type="button">🔄 更新</button>
  </div>
  <div class="install" id="installBox">
    <span id="installMsg"></span>
    <button class="btn primary" id="installBtn" type="button" style="display:none;margin-left:8px">安裝</button>
  </div>
  <div id="list"></div>
</main>

<dialog id="dlg">
  <div class="dhead"><b>設定巴士站（最多 6 個）</b><button class="x" id="dlgClose" type="button">✕</button></div>
  <div class="dbody">
    <div class="hint">可搜站名自動填入（支援九巴＋城巴／新巴）。新巴路線已併入城巴，公司選「城巴／新巴」即可。</div>
    <div class="sbox"><input type="search" id="q" placeholder="搜站名，例如 銅鑼灣 / 鳳德商場"><button class="btn primary" id="searchBtn" type="button">搜尋</button></div>
    <div class="hint" id="searchStatus"></div>
    <div id="results"></div>
    <div id="editList"></div>
    <button class="add" id="addStopBtn" type="button" style="padding:11px;margin-top:4px">＋ 新增巴士站</button>
    <div class="actions">
      <button class="btn primary" id="saveBtn" type="button">儲存</button>
      <button class="btn" id="cancelBtn" type="button">取消</button>
      <button class="btn" id="resetBtn" type="button">恢復預設</button>
    </div>
  </div>
</dialog>

<script>
"use strict";
const KMB_ETA = "https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/";
const CTB_ETA = "https://rt.data.gov.hk/v1/transport/batch/stop-eta/CTB/";
const HKBUS_DATA = ["https://data.hkbus.app/routeFareList.min.json","https://hkbus.github.io/hk-bus-crawling/routeFareList.min.json"];
const PROXIES = [u=>`https://corsproxy.io/?${encodeURIComponent(u)}`, u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`];
const MAX_STOPS = 6, REFRESH_MS = 30000;
const KEY_STOPS = "bus-stops-v3", KEY_INDEX = "bus-stoplist-v1", INDEX_TTL = 864e5;
const DEFAULT_STOPS = [
  { name:"鳳德商場", code:"WT408", id:"A0FDF34B2D278750", co:"KMB" },
  { name:"龍蟠苑",   code:"WT133", id:"4B9D547F0F450784", co:"KMB" }
];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rd = k => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; } };
const wr = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };
const detectCo = id => { const s=(id||"").trim(); if(!s) return "KMB"; if(/^[0-9]{6}$/.test(s)) return "CTB"; if(/^[0-9A-Fa-f]{16}$/.test(s)) return "KMB"; return s.length<=8?"CTB":"KMB"; };

let stops = (() => { const p = rd(KEY_STOPS); return Array.isArray(p) && p.length ? p.slice(0,MAX_STOPS) : JSON.parse(JSON.stringify(DEFAULT_STOPS)); })();
let draft = [], stopIndex = null, target = null, busy = false;

async function getJson(url, ms=12000) {
  const go = async u => { const ac=new AbortController(), t=setTimeout(()=>ac.abort(),ms);
    try { const r = await fetch(u,{signal:ac.signal,cache:"no-store"}); if(!r.ok) throw 0; return await r.json(); } finally { clearTimeout(t); } };
  try { return await go(url); } catch {}
  for (const p of PROXIES) { try { return await go(p(url)); } catch {} }
  throw new Error("網絡錯誤");
}

/* ---- 到站 ---- */
async function fetchEta(s) {
  const co = s.co || detectCo(s.id), id = s.id.trim();
  const j = await getJson(co==="CTB" ? `${CTB_ETA}${id}?lang=zh-hant` : KMB_ETA + id);
  return (j.data||[]).map(e => ({ route:e.route, dest:e.dest_tc||e.dest||e.dest_en||"", eta:e.eta||null,
    rmk:e.rmk_tc||e.rmk||e.rmk_en||"", dir:e.dir, st:e.service_type, co:(e.co==="NWFB"?"NWFB":co) }));
}
const mins = iso => Math.round((new Date(iso)-Date.now())/60000);
const coName = c => c==="KMB"?"九巴":c==="NWFB"?"新巴":"城巴";
function rows(data) {
  const g = {};
  data.forEach(e => { if(!e.eta && !e.rmk) return; const k=[e.route,e.dir,e.st,e.dest].join("|");
    (g[k] ||= {...e, etas:[]}); if(e.eta) g[k].etas.push(e.eta); });
  const arr = Object.values(g).sort((a,b)=>String(a.route).localeCompare(String(b.route),undefined,{numeric:true}));
  if(!arr.length) return `<div class="empty">暫時沒有班次資料</div>`;
  return arr.map(r => {
    r.etas.sort(); const ms = r.etas.slice(0,3).map(mins).filter(m=>m>-2);
    let first="<b>—</b>", rest="";
    if(ms.length){ const m0=Math.max(ms[0],0);
      first = m0<=1 ? `<b class="soon">即將到達</b>` : `<b>${m0}<span style="font-size:12px"> 分鐘</span></b>`;
      if(ms.length>1) rest=`<small>其後 ${ms.slice(1).map(x=>Math.max(x,0)+"′").join("、")}</small>`;
    } else rest=`<small>${esc((r.rmk||"沒有班次").slice(0,14))}</small>`;
    return `<div class="row"><span class="badge ${r.co==="KMB"?"":"ctb"}">${esc(r.route)}</span>
      <div class="dest">往 ${esc(r.dest)}<small>${coName(r.co)}${r.rmk&&ms.length?"・"+esc(r.rmk):""}</small></div>
      <div class="eta">${first}${rest}</div></div>`;
  }).join("");
}
function shell() {
  $("#list").innerHTML = stops.map((s,i)=>`<section class="card"><div class="chead"><span class="no">${i+1}</span>
    <div class="nm"><b>${esc(s.name||"未命名")}<span class="cobadge">${coName(s.co||detectCo(s.id))}</span></b><small>${esc(s.code||"")}</small></div></div>
    <div id="p${i}"><div class="empty">載入中…</div></div></section>`).join("");
}
async function refresh() {
  if(busy) return; busy=true; shell();
  $("#dot").classList.add("live"); $("#statusText").textContent="更新中…";
  const rs = await Promise.allSettled(stops.map(s => s.id ? fetchEta(s) : Promise.reject()));
  rs.forEach((r,i)=>{ const el=$("#p"+i); if(!el) return;
    el.innerHTML = r.status==="fulfilled" ? rows(r.value) : `<div class="err">未能取得到站資料，請稍後再試。</div>`; });
  const t=new Date(), p=n=>String(n).padStart(2,"0");
  $("#statusText").textContent = `已更新 ${p(t.getHours())}:${p(t.getMinutes())}:${p(t.getSeconds())}・每 30 秒自動更新`;
  $("#dot").classList.remove("live"); busy=false;
}

/* ---- 站點搜尋（hkbus 合併資料：九巴＋城巴／新巴） ---- */
async function ensureIndex() {
  if(stopIndex) return stopIndex;
  const c = rd(KEY_INDEX);
  if(c && Array.isArray(c.list) && Date.now()-c.ts < INDEX_TTL) { stopIndex=c.list; return stopIndex; }
  $("#searchStatus").textContent = "正在下載站點資料（首次約需數秒）…";
  let data=null;
  for (const u of HKBUS_DATA) { try { data = await getJson(u, 40000); break; } catch {} }
  if(!data) throw new Error("fail");
  const list = Object.entries(data.stopList||{}).map(([id,info])=>{
    const zh=(info.name&&(info.name.zh||info.name.tc))||"", en=(info.name&&info.name.en)||"";
    const m=(zh+en).match(/\(([A-Z]{1,3}\d{2,4})\)/);
    return { id, name:zh||en||id, en, co:detectCo(id), code:m?m[1]:"" };
  });
  stopIndex = list; wr(KEY_INDEX,{ts:Date.now(),list});
  $("#searchStatus").textContent = `站點資料已載入（${list.length} 個）`;
  return list;
}
async function runSearch() {
  const q=$("#q").value.trim().toLowerCase(), box=$("#results"), st=$("#searchStatus");
  if(!q){ box.innerHTML=""; return; }
  try { await ensureIndex(); } catch { st.textContent="無法載入站點清單，仍可手動輸入 Stop ID"; return; }
  const res=[]; for(const s of stopIndex){ if((s.name+" "+s.en+" "+s.id+" "+s.code).toLowerCase().includes(q)){ res.push(s); if(res.length>=40) break; } }
  box.innerHTML = res.length ? res.map((s,i)=>`<div class="sitem" data-r="${i}"><b>${esc(s.name)}</b>
    <span class="cobadge" style="background:var(--cream-2);color:var(--main-dark)">${coName(s.co)}</span>
    <small>${esc(s.code)} · ${esc(s.id)}</small></div>`).join("") : `<div class="sitem">找不到相符的巴士站</div>`;
  box.querySelectorAll("[data-r]").forEach(el=>el.onclick=()=>{
    const s=res[+el.dataset.r];
    let t = target!=null ? target : (draft.length<MAX_STOPS ? draft.length : draft.length-1);
    if(t>=draft.length) draft.push({});
    draft[t] = { name:s.name, code:s.code||"", id:s.id, co:s.co };
    target=null; renderEdit(); box.innerHTML=""; st.textContent=`已填入：${s.name}`;
  });
}

/* ---- 設定 ---- */
const dlg=$("#dlg");
function renderEdit() {
  $("#editList").innerHTML = draft.map((s,i)=>{ const co=s.co||detectCo(s.id); return `<div class="stopedit">
    <label>站名</label><input type="text" data-i="${i}" data-f="name" value="${esc(s.name||"")}">
    <label>代號（可選）</label><input type="text" data-i="${i}" data-f="code" value="${esc(s.code||"")}">
    <label>公司</label><select data-i="${i}" data-f="co"><option value="KMB" ${co==="KMB"?"selected":""}>九巴 / 龍運</option><option value="CTB" ${co==="CTB"?"selected":""}>城巴 / 新巴</option></select>
    <label>Stop ID</label><div class="rowx"><input type="text" data-i="${i}" data-f="id" value="${esc(s.id||"")}" style="flex:1"><button class="del" data-del="${i}" type="button">刪</button></div>
    <button class="btn" data-fill="${i}" type="button" style="width:100%;margin-top:8px">用搜尋結果填入此站</button></div>`; }).join("");
  $("#editList").querySelectorAll("input,select").forEach(el=>el.addEventListener("input",()=>{
    const i=+el.dataset.i,f=el.dataset.f; draft[i][f]=el.value.trim(); if(f==="id"){ draft[i].co=detectCo(el.value); } }));
  $("#editList").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ if(draft.length<=1){alert("至少保留 1 個站");return;} draft.splice(+b.dataset.del,1); renderEdit(); });
  $("#editList").querySelectorAll("[data-fill]").forEach(b=>b.onclick=()=>{ target=+b.dataset.fill; $("#q").focus(); $("#searchStatus").textContent=`搜尋結果會填入第 ${target+1} 個站`; });
  $("#addStopBtn").style.display = draft.length>=MAX_STOPS ? "none" : "";
}
$("#settingsBtn").onclick=()=>{ draft=JSON.parse(JSON.stringify(stops)); target=null; $("#q").value=""; $("#results").innerHTML=""; $("#searchStatus").textContent=""; renderEdit(); dlg.showModal(); ensureIndex().catch(()=>{ $("#searchStatus").textContent="站點資料載入失敗，仍可手動輸入 Stop ID"; }); };
$("#dlgClose").onclick=$("#cancelBtn").onclick=()=>dlg.close();
$("#searchBtn").onclick=runSearch;
$("#q").addEventListener("keydown",e=>{ if(e.key==="Enter") runSearch(); });
$("#addStopBtn").onclick=()=>{ if(draft.length>=MAX_STOPS) return; draft.push({name:"",code:"",id:"",co:"KMB"}); target=draft.length-1; renderEdit(); $("#q").focus(); };
$("#saveBtn").onclick=()=>{
  for(let i=0;i<draft.length;i++){ const s=draft[i]; if(!s.id){ alert(`第 ${i+1} 個站未填 Stop ID`); return; } s.co=s.co||detectCo(s.id); if(!s.name) s.name=s.code||s.id; }
  if(!wr(KEY_STOPS,draft.slice(0,MAX_STOPS))){ alert("儲存失敗：此裝置未能使用本機儲存空間"); return; }
  stops=JSON.parse(JSON.stringify(draft)).slice(0,MAX_STOPS); dlg.close(); refresh();
};
$("#resetBtn").onclick=()=>{ if(!confirm("恢復預設（鳳德商場、龍蟠苑）？")) return; draft=JSON.parse(JSON.stringify(DEFAULT_STOPS)); renderEdit(); };
$("#refreshBtn").onclick=refresh;
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) refresh(); });

/* ---- 安裝 & SW ---- */
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
let deferred=null;
addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferred=e; $("#installBox").style.display="block"; $("#installMsg").textContent="可安裝成手機 App："; $("#installBtn").style.display=""; });
$("#installBtn").onclick=async()=>{ if(deferred){ deferred.prompt(); deferred=null; $("#installBox").style.display="none"; } };
if(!standalone && /iphone|ipad|ipod/i.test(navigator.userAgent)){ $("#installBox").style.display="block"; $("#installMsg").textContent="安裝：按 Safari 底部「分享」→「加至主畫面」。"; }
if("serviceWorker" in navigator) addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));

refresh(); setInterval(()=>{ if(!document.hidden) refresh(); }, REFRESH_MS);
</script>
</body>
</html>
