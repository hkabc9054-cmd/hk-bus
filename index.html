<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<title>巴士到站</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#73AE52">
<meta name="description" content="香港巴士實時到站（九巴／城巴／新巴）">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="巴士到站">
<style>
:root{
  --main:#73AE52; --main-dark:#2c541e; --main-soft:#5f9441;
  --cream:#FBF1D7; --cream-2:#f3e6c2; --ink:#24351b; --muted:#6c7a5c;
  --kmb:#d2001f; --ctb:#0e7c86;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans HK","Microsoft JhengHei",sans-serif;
  -webkit-text-size-adjust:100%}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--main);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
  position:sticky;top:0;z-index:5;box-shadow:0 2px 0 var(--main-dark)}
.hrow{display:flex;align-items:center;gap:10px}
h1{font-size:20px;margin:0;flex:1;letter-spacing:.04em}
.btn{border:2px solid var(--main-dark);background:var(--cream);color:var(--main-dark);font-weight:700;
  border-radius:12px;padding:7px 12px;font-size:14px;font-family:inherit}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--main-dark);color:var(--cream)}
.status{font-size:12px;margin-top:6px;opacity:.95;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--cream)}
.dot.live{animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
main{padding:14px 14px 40px;max-width:640px;margin:0 auto}
.card{background:#fff;border:2px solid var(--main);border-radius:18px;margin-bottom:14px;overflow:hidden;
  box-shadow:0 3px 0 var(--main)}
.chead{background:var(--main);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
.chead .no{background:var(--cream);color:var(--main-dark);font-weight:800;border-radius:8px;
  min-width:26px;height:26px;display:grid;place-items:center;font-size:14px}
.chead .nm{flex:1;min-width:0}
.chead .nm b{display:block;font-size:17px}
.chead .nm small{opacity:.9;font-size:11px}
.x{background:transparent;border:0;color:#fff;font-size:20px;padding:4px 8px}
.row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--cream-2)}
.row:first-of-type{border-top:0}
.badge{min-width:54px;text-align:center;color:#fff;font-weight:800;font-size:17px;border-radius:9px;padding:4px 6px;background:var(--kmb)}
.badge.ctb{background:var(--ctb)}
.dest{flex:1;min-width:0;font-size:15px}
.dest small{display:block;color:var(--muted);font-size:11px}
.eta{text-align:right;font-variant-numeric:tabular-nums}
.eta b{font-size:20px;color:var(--main-dark)}
.eta b.soon{color:var(--kmb)}
.eta small{display:block;color:var(--muted);font-size:11px}
.empty,.err{padding:14px;color:var(--muted);font-size:14px}
.err{color:#a4311d}
.add{width:100%;padding:16px;font-size:16px;border:2px dashed var(--main);border-radius:18px;background:transparent;
  color:var(--main-dark);font-weight:700;font-family:inherit}
dialog{border:0;border-radius:20px;padding:0;width:min(92vw,520px);background:var(--cream);color:var(--ink);
  max-height:86vh;overflow:hidden}
dialog::backdrop{background:rgba(36,53,27,.5)}
.dhead{background:var(--main);color:#fff;padding:12px 16px;display:flex;align-items:center}
.dhead b{flex:1;font-size:17px}
.dbody{padding:14px;overflow:auto;max-height:calc(86vh - 56px)}
input[type=search],input[type=text]{width:100%;font-size:16px;padding:11px 12px;border:2px solid var(--main);
  border-radius:12px;background:#fff;color:var(--ink);font-family:inherit}
.res{list-style:none;margin:10px 0 0;padding:0}
.res li{padding:11px 12px;border:1px solid var(--cream-2);background:#fff;border-radius:12px;margin-bottom:8px;
  display:flex;gap:8px;align-items:center}
.res li span{flex:1}
.res li small{display:block;color:var(--muted);font-size:11px}
.hint{font-size:12px;color:var(--muted);margin:8px 0}
label{font-size:13px;font-weight:700;display:block;margin:12px 0 4px}
.install{display:none;background:var(--cream-2);border:2px solid var(--main);border-radius:14px;padding:10px 12px;
  margin-bottom:14px;font-size:14px}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>🚌 巴士到站</h1>
    <button class="btn" id="refreshBtn" type="button">重新整理</button>
  </div>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">載入中…</span></div>
</header>
<main>
  <div class="install" id="installBox">
    <span id="installMsg"></span>
    <button class="btn primary" id="installBtn" type="button" style="display:none;margin-left:8px">安裝</button>
  </div>
  <div id="list"></div>
  <button class="add" id="addBtn" type="button">＋ 新增巴士站（<span id="countTxt"></span>）</button>
</main>

<dialog id="dlg">
  <div class="dhead"><b>新增巴士站</b><button class="x" id="dlgClose" type="button">✕</button></div>
  <div class="dbody">
    <input type="search" id="q" placeholder="輸入站名，例如：鑽石山站" autocomplete="off">
    <div style="margin-top:10px"><button class="btn" id="nearBtn" type="button">📍 搜尋附近巴士站</button></div>
    <div class="hint" id="searchHint">首次搜尋需下載九巴站表（約數百 KB），之後會儲存在手機。</div>
    <ul class="res" id="res"></ul>
    <label for="ctbManual">城巴／新巴站號（選填，可在加入後再編輯）</label>
    <input type="text" id="ctbManual" placeholder="例如 001469，多個用逗號分隔" inputmode="numeric">
  </div>
</dialog>

<script>
"use strict";
const KMB = "https://data.etabus.gov.hk/v1/transport/kmb";
const CTB_V2 = "https://rt.data.gov.hk/v2/transport/citybus";
const CTB_BATCH = "https://rt.data.gov.hk/v1/transport/batch";
const MAX_STOPS = 6, REFRESH_MS = 30000, LS_STOPS = "bus.stops.v2", LS_KMBLIST = "bus.kmbstops.v1", LS_CTBMAP = "bus.ctbmap.v1";

const DEFAULTS = [
  { id:"A0FDF34B2D278750", name_tc:"鳳德商場", name_en:"FUNG TAK SHOPPING CENTRE", lat:22.343311, lng:114.199551, ctb:[] },
  { id:"4B9D547F0F450784", name_tc:"龍蟠苑",   name_en:"LUNG POON COURT",          lat:22.342920, lng:114.200382, ctb:[] }
];
const CTB_SEED_ROUTES = ["671","A23","N23"]; // 已知經過鑽石山一帶的城巴／新巴路線

const $ = s => document.querySelector(s);
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };

let stops = lsGet(LS_STOPS, null) || DEFAULTS.map(s => ({...s}));
let ctbMap = lsGet(LS_CTBMAP, {}); // kmbStopId -> {ids:[...], at: ts}
let timer = null, refreshing = false;

const save = () => lsSet(LS_STOPS, stops);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function getJson(url, ms = 12000) {
  const ac = new AbortController(), t = setTimeout(() => ac.abort(), ms);
  try { const r = await fetch(url, { signal: ac.signal }); if (!r.ok) throw new Error(r.status); return await r.json(); }
  finally { clearTimeout(t); }
}

function hav(a, b, c, d) {
  const R = 6371000, r = x => x * Math.PI / 180, dl = r(c - a), dg = r(d - b);
  const h = Math.sin(dl/2)**2 + Math.cos(r(a)) * Math.cos(r(c)) * Math.sin(dg/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

/* ---------- 城巴／新巴：以座標配對站 ---------- */
async function discoverCtb(stop, extraRoutes = []) {
  const cached = ctbMap[stop.id];
  if (cached && Date.now() - cached.at < 7 * 864e5) return cached.ids;
  const routes = [...new Set([...CTB_SEED_ROUTES, ...extraRoutes])];
  const found = new Set();
  await Promise.all(routes.flatMap(rt => ["inbound","outbound"].map(async dir => {
    try {
      const rs = await getJson(`${CTB_V2}/route-stop/CTB/${rt}/${dir}`);
      for (const it of (rs.data || [])) {
        try {
          const sd = await getJson(`${CTB_V2}/stop/${it.stop}`);
          const s = sd.data; if (!s) continue;
          if (hav(stop.lat, stop.lng, +s.lat, +s.long) <= 150) found.add(it.stop);
        } catch {}
      }
    } catch {}
  })));
  const ids = [...found];
  ctbMap[stop.id] = { ids, at: Date.now() };
  lsSet(LS_CTBMAP, ctbMap);
  return ids;
}

/* ---------- 取得到站資料 ---------- */
async function kmbEta(id) {
  const j = await getJson(`${KMB}/stop-eta/${id}`);
  return (j.data || []).map(e => ({ co:"KMB", route:e.route, dir:e.dir, st:e.service_type, dest:e.dest_tc, eta:e.eta, rmk:e.rmk_tc }));
}
async function ctbEta(id) {
  const j = await getJson(`${CTB_BATCH}/stop-eta/CTB/${id}?lang=zh-hant`);
  return (j.data || []).map(e => ({ co:(e.co === "NWFB" ? "NWFB" : "CTB"), route:e.route, dir:e.dir, st:"", dest:e.dest, eta:e.eta, rmk:e.rmk }));
}
async function allEta(stop) {
  const jobs = [kmbEta(stop.id)];
  let ctbIds = [...(stop.ctb || [])];
  try { ctbIds = [...new Set([...ctbIds, ...await discoverCtb(stop)])]; } catch {}
  ctbIds.forEach(id => jobs.push(ctbEta(id)));
  const rs = await Promise.allSettled(jobs);
  const items = rs.filter(r => r.status === "fulfilled").flatMap(r => r.value);
  if (!items.length && rs.every(r => r.status === "rejected")) throw new Error("fetch");
  return items;
}

function group(items) {
  const m = new Map();
  for (const e of items) {
    const k = [e.co, e.route, e.dir, e.st, e.dest].join("|");
    if (!m.has(k)) m.set(k, { ...e, etas: [] });
    if (e.eta) m.get(k).etas.push(e.eta);
  }
  const arr = [...m.values()];
  arr.forEach(g => g.etas.sort());
  const num = r => parseInt(r.replace(/\D/g, "") || "9999", 10);
  return arr.sort((a, b) => num(a.route) - num(b.route) || a.route.localeCompare(b.route));
}
const mins = iso => Math.round((new Date(iso) - Date.now()) / 60000);
const opTag = co => co === "KMB" ? "九巴" : co === "NWFB" ? "新巴" : "城巴";

function renderRows(items) {
  const g = group(items);
  if (!g.length) return `<div class="empty">暫時沒有班次資料</div>`;
  return g.map(r => {
    const ms = r.etas.slice(0, 3).map(mins).filter(m => m > -2);
    let first = `<b>—</b>`, rest = "";
    if (ms.length) {
      const m0 = Math.max(ms[0], 0);
      first = m0 <= 1 ? `<b class="soon">即將到達</b>` : `<b>${m0}<span style="font-size:12px"> 分鐘</span></b>`;
      if (ms.length > 1) rest = `<small>其後 ${ms.slice(1).map(x => Math.max(x,0) + "′").join("、")}</small>`;
    } else rest = `<small>${esc(r.rmk || "沒有班次")}</small>`;
    return `<div class="row"><span class="badge ${r.co === "KMB" ? "" : "ctb"}">${esc(r.route)}</span>
      <div class="dest">往 ${esc(r.dest)}<small>${opTag(r.co)}${r.rmk && ms.length ? "・" + esc(r.rmk) : ""}</small></div>
      <div class="eta">${first}${rest}</div></div>`;
  }).join("");
}

/* ---------- 畫面 ---------- */
function renderShell() {
  $("#countTxt").textContent = `${stops.length}/${MAX_STOPS}`;
  $("#addBtn").style.display = stops.length >= MAX_STOPS ? "none" : "";
  $("#list").innerHTML = stops.map((s, i) => `
    <section class="card" data-id="${s.id}">
      <div class="chead"><span class="no">${i + 1}</span>
        <div class="nm"><b>${esc(s.name_tc)}</b><small>${esc(s.name_en || "")}</small></div>
        <button class="x" data-del="${s.id}" aria-label="移除">✕</button></div>
      <div class="body"><div class="empty">載入中…</div></div>
    </section>`).join("");
}

async function refreshOne(s) {
  const el = document.querySelector(`.card[data-id="${s.id}"] .body`);
  if (!el) return;
  try { el.innerHTML = renderRows(await allEta(s)); }
  catch { el.innerHTML = `<div class="err">未能連線取得到站資料，請稍後再試。</div>`; }
}
async function refreshAll() {
  if (refreshing) return; refreshing = true;
  $("#dot").classList.add("live"); $("#statusText").textContent = "更新中…";
  await Promise.all(stops.map(refreshOne));
  const t = new Date();
  $("#statusText").textContent = `已更新 ${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")}:${String(t.getSeconds()).padStart(2,"0")}・每 30 秒自動更新`;
  $("#dot").classList.remove("live"); refreshing = false;
}

$("#refreshBtn").onclick = refreshAll;
$("#list").addEventListener("click", e => {
  const id = e.target.closest("[data-del]")?.dataset.del;
  if (!id) return;
  const s = stops.find(x => x.id === id);
  if (s && confirm(`移除「${s.name_tc}」？`)) { stops = stops.filter(x => x.id !== id); save(); renderShell(); refreshAll(); }
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshAll(); });

/* ---------- 新增巴士站 ---------- */
const dlg = $("#dlg");
let kmbList = null;
async function loadKmbList() {
  if (kmbList) return kmbList;
  kmbList = lsGet(LS_KMBLIST, null);
  if (kmbList && kmbList.length) return kmbList;
  $("#searchHint").textContent = "下載站表中…";
  const j = await getJson(`${KMB}/stop`, 40000);
  kmbList = (j.data || []).map(s => ({ id:s.stop, n:s.name_tc, e:s.name_en, a:+s.lat, o:+s.long }));
  lsSet(LS_KMBLIST, kmbList);
  $("#searchHint").textContent = "";
  return kmbList;
}
function showResults(list) {
  $("#res").innerHTML = list.slice(0, 30).map(s => `
    <li><span>${esc(s.n)}<small>${esc(s.e)}${s.d != null ? "・約 " + Math.round(s.d) + " 米" : ""}</small></span>
    <button class="btn primary" data-add="${s.id}" type="button">加入</button></li>`).join("") ||
    `<li><span>找不到相符的巴士站</span></li>`;
}
$("#addBtn").onclick = () => { $("#res").innerHTML = ""; $("#q").value = ""; $("#ctbManual").value = ""; dlg.showModal(); };
$("#dlgClose").onclick = () => dlg.close();
$("#q").addEventListener("input", async e => {
  const q = e.target.value.trim();
  if (!q) { $("#res").innerHTML = ""; return; }
  try { const L = await loadKmbList(); showResults(L.filter(s => s.n.includes(q) || s.e.toLowerCase().includes(q.toLowerCase()))); }
  catch { $("#searchHint").textContent = "下載站表失敗，請檢查網絡。"; }
});
$("#nearBtn").onclick = () => {
  if (!navigator.geolocation) { $("#searchHint").textContent = "此裝置不支援定位。"; return; }
  $("#searchHint").textContent = "定位中…";
  navigator.geolocation.getCurrentPosition(async p => {
    try {
      const L = await loadKmbList();
      const near = L.map(s => ({ ...s, d: hav(p.coords.latitude, p.coords.longitude, s.a, s.o) })).sort((a, b) => a.d - b.d).slice(0, 20);
      $("#searchHint").textContent = ""; showResults(near);
    } catch { $("#searchHint").textContent = "下載站表失敗，請檢查網絡。"; }
  }, () => { $("#searchHint").textContent = "未能取得位置，請允許定位或改用站名搜尋。"; }, { enableHighAccuracy:true, timeout:10000 });
};
$("#res").addEventListener("click", async e => {
  const id = e.target.closest("[data-add]")?.dataset.add; if (!id) return;
  if (stops.length >= MAX_STOPS) { alert("最多只能儲存 6 個巴士站"); return; }
  if (stops.some(s => s.id === id)) { alert("此站已加入"); return; }
  const s = kmbList.find(x => x.id === id);
  const ctb = $("#ctbManual").value.split(/[,，\s]+/).map(x => x.trim()).filter(Boolean);
  const stop = { id:s.id, name_tc:s.n, name_en:s.e, lat:s.a, lng:s.o, ctb };
  stops.push(stop); save(); dlg.close(); renderShell();
  // 同一站九巴路線號碼，也拿來嘗試配對聯營（城巴／新巴）路線
  try {
    const kmbRoutes = [...new Set((await kmbEta(stop.id)).map(x => x.route))];
    discoverCtb(stop, kmbRoutes).then(() => refreshOne(stop)).catch(() => {});
  } catch {}
  refreshAll();
});

/* ---------- 安裝提示 & Service Worker ---------- */
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
let deferred = null;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); deferred = e;
  $("#installBox").style.display = "block"; $("#installMsg").textContent = "可安裝成手機 App：";
  $("#installBtn").style.display = "";
});
$("#installBtn").onclick = async () => { if (deferred) { deferred.prompt(); deferred = null; $("#installBox").style.display = "none"; } };
if (!standalone && /iphone|ipad|ipod/i.test(navigator.userAgent)) {
  $("#installBox").style.display = "block";
  $("#installMsg").textContent = "安裝：按 Safari 底部「分享」→「加至主畫面」。";
}
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));

renderShell(); refreshAll();
timer = setInterval(() => { if (!document.hidden) refreshAll(); }, REFRESH_MS);
</script>
</body>
</html>
